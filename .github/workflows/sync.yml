name: Config Update

permissions:
  contents: write

concurrency:
  group: geosite-sync-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update (allow large rule reduction)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 14 1,15 * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyyaml urllib3

      - name: Install sing-box
        run: |
          SING_BOX_VERSION="1.14.4"
          SING_BOX_SHA256="699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968"
          curl -sSL --retry 3 --retry-delay 2 -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  sing-box.tar.gz" | sha256sum -c -
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
          rm -rf "sing-box-${SING_BOX_VERSION}-linux-amd64" sing-box.tar.gz

      - name: Install mihomo
        run: |
          MIHOMO_VERSION="v1.19.33"
          MIHOMO_SHA256="132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323"
          curl -sSL --retry 3 --retry-delay 2 -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum -c -
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Generate rules
        run: |
          FLAGS=""
          if [ "${{ inputs.force_update }}" = "true" ]; then
            FLAGS="--allow-large-shrink"
          fi
          python script/generate_ai.py $FLAGS
          python main.py
          python script/convert_to_mrs.py
          test -s Private/AI.list
          test -s rule/AI.json
          test -s rule/AI.srs
          test -s rule/AI_domain.mrs
          test -s rule/AI_ip.mrs
          test -s rule/AI_clash.yaml

      - name: Remove empty files
        run: |
          find rule -type f -size 0 -delete
          find Private -type f -size 0 -delete

      - name: Commit and push
        id: git_commit
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          git add rule/*.json 2>/dev/null || echo "No json files"
          git add rule/*.srs 2>/dev/null || echo "No srs files"
          git add rule/*.mrs 2>/dev/null || echo "No mrs files"
          git add rule/*_clash.yaml 2>/dev/null || echo "No clash yaml files"
          git add Private/*.list 2>/dev/null || echo "No private list files"
          git add Private/*.snippet 2>/dev/null || echo "No private snippet files"

          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "Update rules"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        if: steps.git_commit.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: ver
        run: echo "tag=v1.1.1.$(date -u +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: success() && (steps.git_commit.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            rule/*.json
            rule/*.srs
            rule/*.mrs
            rule/*_clash.yaml
            Private/*.list
            Private/*.snippet
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
